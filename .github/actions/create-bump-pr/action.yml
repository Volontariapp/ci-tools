name: "Create Bump and Changelog PR"
description: "Bumps versions, updates changelogs, and creates a PR for modified packages"
inputs:
  github_token:
    description: "GitHub Token"
    required: true
  commit_message:
    description: "Commit message"
    default: "chore(proto): auto-update typings and prepare release"
  pr_title:
    description: "PR Title"
    default: "chore: sync proto typings"
  pr_body:
    description: "PR Body"
    default: "Auto-generated proto typings update."
  changed_pkgs:
    description: "Space-separated list of changed packages in npm-packages/packages/"
    required: true
runs:
  using: "composite"
  steps:
    - name: Create PR
      shell: bash
      working-directory: npm-packages
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        if [ -z "${{ inputs.changed_pkgs }}" ]; then
          echo "No packages changed."
          exit 0
        fi

        echo "Changes detected in: ${{ inputs.changed_pkgs }}"

        BRANCH_NAME="bot/sync-proto-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        git checkout -b "$BRANCH_NAME"

        # Create a changeset file for the modified packages
        CHANGESET_FILE=".changeset/proto-sync-${GITHUB_RUN_ID}.md"
        echo "---" > "$CHANGESET_FILE"
        for PKG in ${{ inputs.changed_pkgs }}; do
          if [ -f "packages/$PKG/package.json" ]; then
            REAL_NAME=$(node -p "require('./packages/$PKG/package.json').name")
            echo "\"$REAL_NAME\": patch" >> "$CHANGESET_FILE"
          fi
        done
        echo "---" >> "$CHANGESET_FILE"
        echo "" >> "$CHANGESET_FILE"
        echo "${{ inputs.pr_body }}" >> "$CHANGESET_FILE"

        echo "Generated changeset file: $CHANGESET_FILE"
        
        # Ensure dependencies are installed (including changesets CLI)
        yarn install

        # Run changeset version to update package.json and CHANGELOG.md files
        yarn changeset version

        git add packages/
        git commit -m "${{ inputs.commit_message }}"
        git push -u origin "$BRANCH_NAME"

        PR_URL=$(gh pr create --title "${{ inputs.pr_title }}" --body "${{ inputs.pr_body }}" --head "$BRANCH_NAME" --base main)
        echo "Created PR: $PR_URL"

        PR_NUMBER=$(echo "$PR_URL" | awk -F'/' '{print $NF}')

        for PKG in ${{ inputs.changed_pkgs }}; do
          if [ -f "packages/$PKG/CHANGELOG.md" ]; then
            sed -i "s/PR_PLACEHOLDER/$PR_NUMBER/g" "packages/$PKG/CHANGELOG.md"
          fi
        done

        git add packages/
        git commit -m "chore: inject PR link into changelogs"
        git push origin "$BRANCH_NAME"

        sleep 5
        gh pr merge "$PR_URL" --squash --admin --delete-branch
