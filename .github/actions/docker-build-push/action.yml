name: 'Docker Build & Push'
description: 'Builds and pushes a Docker image to GitHub Container Registry, including optional E2E image'

inputs:
  service-name:
    description: 'Name of the service (used for the image name)'
    required: true
  context:
    description: 'Docker build context'
    required: false
    default: '.'
  file:
    description: 'Path to Dockerfile'
    required: false
    default: './Dockerfile'
  github-token:
    description: 'GitHub Token for GHCR authentication'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Check for E2E Dockerfile
      id: check-e2e
      shell: bash
      run: |
        if [ -f "${{ inputs.context }}/Dockerfile.e2e" ]; then
          echo "has_e2e=true" >> $GITHUB_OUTPUT
        else
          echo "has_e2e=false" >> $GITHUB_OUTPUT
        fi

    # --- Main Service Image ---
    - name: Extract Main metadata
      id: meta-main
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ inputs.service-name }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=ref,event=branch
          type=ref,event=pr
          type=raw,value=${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}
          type=ref,event=tag
          type=sha
        flavor: |
          latest=false

    - name: Build and Push Main Image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: true
        tags: ${{ steps.meta-main.outputs.tags }}
        labels: ${{ steps.meta-main.outputs.labels }}

    # --- E2E Image (Conditional) ---
    - name: Extract E2E metadata
      if: ${{ steps.check-e2e.outputs.has_e2e == 'true' }}
      id: meta-e2e
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ inputs.service-name }}-e2e
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=ref,event=branch
          type=ref,event=pr
          type=raw,value=${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}
          type=ref,event=tag
          type=sha
        flavor: |
          latest=false

    - name: Build and Push E2E Image
      if: ${{ steps.check-e2e.outputs.has_e2e == 'true' }}
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/Dockerfile.e2e
        push: true
        tags: ${{ steps.meta-e2e.outputs.tags }}
        labels: ${{ steps.meta-e2e.outputs.labels }}
