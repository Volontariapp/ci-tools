name: Docker Build & Push on GitHub Container Registry

on: 
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check for E2E Dockerfile
        id: check-e2e
        shell: bash
        run: |
          if [ -f "./Dockerfile.e2e" ]; then
            echo "has_e2e=true" >> $GITHUB_OUTPUT
          else
            echo "has_e2e=false" >> $GITHUB_OUTPUT
          fi

      # --- Main Service Image ---
      - name: Extract Main metadata
        id: meta-main
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.service-name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=tag
            type=sha
          flavor: |
            latest=false

      - name: Build and Push Main Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-main.outputs.tags }}
          labels: ${{ steps.meta-main.outputs.labels }}

      # --- E2E Image (Conditional) ---
      - name: Extract E2E metadata
        if: ${{ steps.check-e2e.outputs.has_e2e == 'true' }}
        id: meta-e2e
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.service-name }}-e2e
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha
          flavor: |
            latest=false

      - name: Build and Push E2E Image
        if: ${{ steps.check-e2e.outputs.has_e2e == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.e2e
          push: true
          tags: ${{ steps.meta-e2e.outputs.tags }}
          labels: ${{ steps.meta-e2e.outputs.labels }}