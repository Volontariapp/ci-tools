name: E2E Matrix Validator

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string

jobs:
  validate-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true # Required to access ci-tools/scripts

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Validate e2e-matrix.json
        run: ./ci-tools/scripts/validate-matrix-main.sh "${{ inputs.service-name }}"
