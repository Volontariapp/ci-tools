name: E2E Matrix Validator

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string

jobs:
  validate-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # Required to access ci-tools/scripts

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Validate e2e-matrix.json
        run: ./ci-tools/scripts/validate-matrix-main.sh "${{ inputs.service-name }}"
