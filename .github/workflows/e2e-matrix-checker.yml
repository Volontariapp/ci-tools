name: E2E Matrix Validator

on:
  pull_request:
    branches:
      - main
    paths:
      - 'e2e-matrix.json'
      - 'scripts/validate-matrix-main.sh'

jobs:
  validate-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Make script executable
        run: chmod +x scripts/validate-matrix-main.sh

      - name: Validate e2e-matrix.json
        run: ./scripts/validate-matrix-main.sh
