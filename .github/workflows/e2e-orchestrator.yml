name: "E2E Orchestrator"

on:
  workflow_call:

jobs:
  e2e-tests:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PULL_TOKEN }}

      - name: Generate Certificates
        run: ./ci-tools/scripts/generate-certs.sh

      - name: Docker Compose Pull
        run: docker compose -f ci-tools/docker-compose.yml --profile e2e pull

      - name: Run E2E Infrastructure & Tests
        run: |
          docker compose -f ci-tools/docker-compose.yml --profile e2e up --exit-code-from api-gateway-e2e

      - name: Cleanup
        if: always()
        run: docker compose -f ci-tools/docker-compose.yml --profile e2e down -v

