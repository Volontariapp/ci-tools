name: "E2E Orchestrator"

on:
  workflow_call:

jobs:
  e2e-tests:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Authentication
        run: |
          if [ -z "${{ secrets.ORG_REPO_TOKEN }}" ]; then
            echo "::warning:: ORG_REPO_TOKEN is not provided. Falling back to GITHUB_TOKEN."
            echo "::notice:: GITHUB_TOKEN usually lacks permissions to pull private images from other repositories in the organization. If 'denied' errors occur, ensure the caller workflow passes 'secrets: inherit' or explicitly provides 'ORG_REPO_TOKEN'."
          else
            echo "ORG_REPO_TOKEN is present and will be used for GHCR authentication."
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ORG_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate Certificates
        run: ./ci-tools/scripts/generate-certs.sh

      - name: Docker Compose Pull
        run: docker compose -f ci-tools/docker-compose.yml --profile e2e pull

      - name: Run E2E Infrastructure & Tests
        run: |
          docker compose -f ci-tools/docker-compose.yml --profile e2e up --exit-code-from api-gateway-e2e

      - name: Cleanup
        if: always()
        run: docker compose -f ci-tools/docker-compose.yml --profile e2e down -v

