name: "E2E Orchestrator"

on:
  workflow_call:

jobs:
  e2e-tests:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # The event payload is frozen when the run starts: Dependabot adds its labels a few seconds after opening the PR.
      # Read the labels live (ORG_REPO_TOKEN) and fall back to the payload when the secret is unavailable.
      - name: Check for docker-and-e2e label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
          PAYLOAD_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels="$PAYLOAD_LABELS"
          if [ -n "$GH_TOKEN" ]; then
            labels="$labels $(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | tr '\n' ' ' || true)"
          fi
          if ! echo " $labels " | grep -q " docker-and-e2e "; then
            echo "::error::The 'docker-and-e2e' label is missing. If you want the PR to be mergeable, add the tag to run the full CI."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PULL_TOKEN }}

      - name: Generate Certificates
        run: ./ci-tools/scripts/generate-certs.sh

      - name: Parse E2E Matrix
        run: ./ci-tools/scripts/e2e-matrix-parsing.sh

      - name: Docker Compose Pull
        run: docker compose -f ci-tools/docker-compose.yml --profile e2e --profile migrations pull

      - name: Run Migrations
        run: |
          docker compose -f ci-tools/docker-compose.yml --profile migrations run --rm ms-user-migration &
          docker compose -f ci-tools/docker-compose.yml --profile migrations run --rm ms-post-migration &
          docker compose -f ci-tools/docker-compose.yml --profile migrations run --rm ms-event-migration &
          docker compose -f ci-tools/docker-compose.yml --profile migrations run --rm ms-social-migration &
          docker compose -f ci-tools/docker-compose.yml --profile migrations run --rm ms-storage-migration &
          docker compose -f ci-tools/docker-compose.yml --profile migrations run --rm minio-init &
          wait

      - name: Run E2E Infrastructure & Tests
        run: |
          docker compose -f ci-tools/docker-compose.yml --profile e2e up --exit-code-from api-gateway-e2e

      - name: Cleanup
        if: always()
        run: docker compose -f ci-tools/docker-compose.yml --profile e2e --profile migrations down -v

