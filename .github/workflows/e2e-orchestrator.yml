name: "E2E Orchestrator"

on:
  workflow_call:

jobs:
  e2e-tests:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Check for docker-and-e2e label
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'docker-and-e2e')
        run: |
          echo "::error::The 'docker-and-e2e' label is missing. If you want the PR to be mergeable, add the tag to run the full CI."
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PULL_TOKEN }}

      - name: Generate Certificates
        run: ./ci-tools/scripts/generate-certs.sh

      - name: Parse E2E Matrix
        run: ./ci-tools/scripts/e2e-matrix-parsing.sh

      - name: Docker Compose Pull
        run: docker compose -f ci-tools/docker-compose.yml --profile e2e --profile migrations pull

      - name: Run Migrations
        run: |
          docker compose -f ci-tools/docker-compose.yml --profile migrations run --rm ms-user-migration &
          docker compose -f ci-tools/docker-compose.yml --profile migrations run --rm ms-post-migration &
          docker compose -f ci-tools/docker-compose.yml --profile migrations run --rm ms-event-migration &
          docker compose -f ci-tools/docker-compose.yml --profile migrations run --rm ms-social-migration &
          wait

      - name: Run E2E Infrastructure & Tests
        run: |
          docker compose -f ci-tools/docker-compose.yml --profile e2e up --exit-code-from api-gateway-e2e

      - name: Cleanup
        if: always()
        run: docker compose -f ci-tools/docker-compose.yml --profile e2e --profile migrations down -v

