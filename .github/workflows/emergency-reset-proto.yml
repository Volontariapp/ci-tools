name: Emergency Reset Proto Sync

on:
  workflow_call:
    inputs:
      proto_repository:
        description: "Repository containing the proto files"
        default: "Volontariapp/proto-registry"
        type: string
      npm_repository:
        description: "Repository for the npm packages"
        default: "Volontariapp/npm-packages"
        type: string
      node_version:
        description: "Node version to use"
        default: "24.14.0"
        type: string
    secrets:
      ORG_REPO_TOKEN:
        required: true

jobs:
  emergency-reset-sync:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.labels.*.name && contains(github.event.pull_request.labels.*.name, 'reset') &&
      startsWith(github.head_ref, 'debug/')
    steps:
      - name: Setup Git Configuration
        uses: Volontariapp/ci-tools/.github/actions/setup-git@main

      - name: Checkout NPM Packages
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.npm_repository }}
          token: ${{ secrets.ORG_REPO_TOKEN }}
          path: npm-packages
          submodules: recursive

      - name: Checkout Proto Registry
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.proto_repository }}
          token: ${{ secrets.ORG_REPO_TOKEN }}
          path: proto-registry

      - name: Setup Node & Yarn
        uses: Volontariapp/ci-tools/.github/actions/setup-node-yarn@main
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install Protobuf Tools (buf & ts-proto)
        run: |
          npm install -g @bufbuild/buf ts-proto

      - name: full Regeneration and Sync
        run: |
          cd proto-registry

          # 1. Clean and Full Generate
          rm -rf gen/ts
          buf generate

          # Fix protobufjs imports for ESM
          find gen/ts -name "*.ts" -exec sed -i 's/import { wrappers } from ["'\'']protobufjs["'\'']/import _m0 from "protobufjs"; const { wrappers } = _m0/g' {} +

          CONTRACTS_ROOT="../npm-packages/packages/contracts"
          NEST_ROOT="../npm-packages/packages/contracts-nest"

          # 1. Sync Protos to Nest integration package (Breaking symlink if it exists)
          PROTO_DEST="$NEST_ROOT/proto"
          if [ -L "$PROTO_DEST" ]; then
            rm -f "$PROTO_DEST"
          fi
          rm -rf "$PROTO_DEST"
          mkdir -p "$PROTO_DEST"
          cp -r proto/* "$PROTO_DEST/"

          # 2. Sync Clean Contracts (Front-end compatible)
          DOMAINS="user post event common"
          for DOMAIN in $DOMAINS; do
            if [ -d "gen/ts/volontariapp/$DOMAIN" ]; then
              DOMAIN_DEST="$CONTRACTS_ROOT/src/$DOMAIN"
              mkdir -p "$DOMAIN_DEST"
              find "$DOMAIN_DEST" -type f -name "*.ts" ! -name "index.ts" -delete
              # Copy then remove services
              cp gen/ts/volontariapp/$DOMAIN/*.ts "$DOMAIN_DEST/"
              find "$DOMAIN_DEST" -name "*.services.ts" -delete
            fi
          done

          # 3. Sync NestJS Contracts (Full integration)
          for DOMAIN in $DOMAINS; do
            if [ -d "gen/ts/volontariapp/$DOMAIN" ]; then
              DOMAIN_DEST="$NEST_ROOT/src/$DOMAIN"
              mkdir -p "$DOMAIN_DEST"
              find "$DOMAIN_DEST" -type f -name "*.ts" ! -name "index.ts" -delete
              cp gen/ts/volontariapp/$DOMAIN/*.ts "$DOMAIN_DEST/"
            fi
          done

          # 4. Sync Google Protos to both
          if [ -d "gen/ts/google/protobuf" ]; then
            for ROOT in "$CONTRACTS_ROOT" "$NEST_ROOT"; do
              GOOGLE_DEST="$ROOT/src/google/protobuf"
              mkdir -p "$GOOGLE_DEST"
              find "$GOOGLE_DEST" -type f -name "*.ts" ! -name "index.ts" -delete
              cp gen/ts/google/protobuf/*.ts "$GOOGLE_DEST/"
            done
          fi

          # Generate/Update barrel files for each domain
          for ROOT in "$CONTRACTS_ROOT" "$NEST_ROOT"; do
            for DIR in $(find "$ROOT/src" -maxdepth 1 -type d ! -path "$ROOT/src"); do
              DOMAIN_NAME=$(basename "$DIR")
              INDEX_FILE="$DIR/index.ts"
              echo "// Auto-generated barrel file" > "$INDEX_FILE"
              for TS_FILE in $(find "$DIR" -maxdepth 1 -name "*.ts" ! -name "index.ts"); do
                BASE=$(basename "$TS_FILE" .ts)
                echo "export * from './$BASE.js';" >> "$INDEX_FILE"
              done
            done
          done

      - name: Create Emergency Reset PR
        id: reset-pr
        uses: Volontariapp/ci-tools/.github/actions/create-bump-pr@main
        with:
          github_token: ${{ secrets.ORG_REPO_TOKEN }}
          changed_pkgs: "contracts contracts-nest"
          commit_message: "fix(proto): emergency full reset of types for contracts and contracts-nest"
          pr_title: "🚨 EMERGENCY: Full Proto Reset"
          pr_body: "This PR performs a full regeneration of all proto files and TypeScript types for both pure @volontariapp/contracts and NestJS @volontariapp/contracts-nest packages."

      - name: Comment PR link on original PR
        if: github.event.pull_request.number != null
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
          PR_URL: ${{ steps.reset-pr.outputs.pr_url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ inputs.proto_repository }} --body "🚀 **Emergency Reset completed!**

          Typings have been updated for both packages. You can follow the release PR here:
          $PR_URL"
