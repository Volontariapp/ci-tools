name: Cleanup GHCR Packages

on:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 3 AM
  workflow_dispatch:

jobs:
  clean-ghcr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      # NOTE: GHCR_CLEANUP_TOKEN must be a Classic PAT (ghp_...) with the following scopes:
      # - 'read:packages'
      # - 'delete:packages'
      # - 'repo' (REQUIRED to see packages linked to Private repositories)
      # - 'read:org' (REQUIRED to list packages at the organization level)
      # The Volontariapp organization policy requires the token to have an expiration < 366 days.
      # If this run fails with a 403 or 'invalid token' error, please renew the token and update the secret.
      - name: Delete old images (Keep only the latest)
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: Volontariapp
          image-names: "api-gateway* ws-service* deploy* ms-event* ms-post* ms-social* ms-user* post-processor-* worker-* outbox-*"
          cut-off: 24h
          keep-n-most-recent: 1
          token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
