name: Job - Emergency Release

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Dry run: list missing packages without publishing"
        type: boolean
        default: false
    secrets:
      ORG_REPO_TOKEN:
        required: true
      NPM_TOKEN:
        required: true

jobs:
  emergency-release:
    name: Emergency Release
    runs-on: ubuntu-latest

    outputs:
      published_tags: ${{ steps.publish.outputs.published_tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.ORG_REPO_TOKEN }}
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: yarn install --immutable

      - name: Configure npm & yarn auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          yarn config set 'npmRegistries["//registry.npmjs.org/"].npmAuthToken' "${{ secrets.NPM_TOKEN }}"

      - name: Build orchestration plan (all packages)
        id: plan
        run: |
          PLAN=$(python3 scripts/ci-orchestrate.py --force-all)

          echo "=== Orchestration Plan (force-all) ==="
          echo "$PLAN" | python3 -m json.tool
          echo "======================================"

          {
            echo "json_plan<<EOF"
            echo "$PLAN"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish missing versions
        id: publish
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo '${{ steps.plan.outputs.json_plan }}' > /tmp/emergency-plan.json
          EXTRA_ARGS=""
          [[ "$DRY_RUN" == "true" ]] && EXTRA_ARGS="--dry-run"
          bash scripts/ci-emergency-publish.sh --plan /tmp/emergency-plan.json $EXTRA_ARGS
