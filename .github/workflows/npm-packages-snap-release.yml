name: Job - Snapshot Release

on:
  workflow_call:
    inputs:
      json_plan:
        description: Full ci-orchestrate.py plan JSON
        required: true
        type: string
    secrets:
      ORG_REPO_TOKEN:
        required: true
      NPM_TOKEN:
        required: true

jobs:
  snap-release:
    name: Snapshot Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.ORG_REPO_TOKEN }}
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node (no cache — full fresh cycle)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: yarn install --immutable

      - name: Configure npm & yarn auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          yarn config set 'npmRegistries["//registry.npmjs.org/"].npmAuthToken' "${{ secrets.NPM_TOKEN }}"

      - name: Publish snapshot packages
        id: publish
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          JSON_PLAN: ${{ inputs.json_plan }}
        run: |
          echo "$JSON_PLAN" > /tmp/ci-plan.json
          bash scripts/ci-snap-publish.sh --plan /tmp/ci-plan.json

      - name: Download coverage summaries
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: coverage-artifacts
          pattern: coverage-summary-*

      # With a single matching artifact, download-artifact extracts it straight into the target
      # directory instead of one folder per artifact, and ci-pr-comment.py looks for
      # coverage-artifacts/coverage-summary-<id>/coverage-summary.json: the table showed dashes.
      - name: Normalize the coverage artifact layout
        if: github.event_name == 'pull_request'
        env:
          JSON_PLAN: ${{ inputs.json_plan }}
        run: |
          if [ -f coverage-artifacts/coverage-summary.json ]; then
            BUILD_IDS=$(echo "$JSON_PLAN" | jq -r '[.packages[] | select(.action == "BUILD") | .id] | join(" ")')
            set -- $BUILD_IDS
            if [ "$#" -eq 1 ]; then
              mkdir -p "coverage-artifacts/coverage-summary-$1"
              mv coverage-artifacts/coverage-summary.json "coverage-artifacts/coverage-summary-$1/"
              echo "Moved the coverage summary of $1 into its own folder."
            else
              echo "Single summary file but $# packages built: layout left untouched."
            fi
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JSON_PLAN: ${{ inputs.json_plan }}
        run: |
          echo "$JSON_PLAN" > /tmp/ci-plan.json
          python3 scripts/ci-pr-comment.py \
            --plan      /tmp/ci-plan.json \
            --artifacts coverage-artifacts \
            --pr        "${{ github.event.pull_request.number }}" \
            --run-id    "${{ github.run_id }}" \
            --repo      "${{ github.repository }}"
