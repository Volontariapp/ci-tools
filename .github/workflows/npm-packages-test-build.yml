name: NPM Packages Test & Build

on:
  workflow_call:
    inputs:
      changed_packages:
        description: "JSON array of changed packages"
        required: true
        type: string
      snapshot_suffix:
        description: "Shared suffix for snapshot versions"
        required: false
        type: string
    secrets:
      ORG_REPO_TOKEN:
        required: true
      NPM_TOKEN:
        required: false

jobs:
  test-build:
    name: Test & Build (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(inputs.changed_packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_TOKEN }}

      - name: Setup Node & Yarn
        uses: Volontariapp/ci-tools/.github/actions/setup-node-yarn@main
        with:
          node-version: 24.14.0
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Package
        run: |
          PKG_NAME=$(node -p "require('./packages/${{ matrix.package }}/package.json').name")
          yarn workspaces foreach -Rt --from "$PKG_NAME" run build

      - name: Build Test Database
        if: ${{ matrix.package == 'database' || matrix.package == 'bridge' || matrix.package == 'bridge-nest' || matrix.package == 'health-check' || matrix.package == 'health-check-nest' }}
        run: docker compose -f ci-tools/testing/docker-compose.yml --profile test build

      - name: Setup Test Database
        if: ${{ matrix.package == 'database' || matrix.package == 'bridge' || matrix.package == 'bridge-nest' || matrix.package == 'health-check' || matrix.package == 'health-check-nest' }}
        run: docker compose -f ci-tools/testing/docker-compose.yml --profile test up -d --wait

      - name: Domain Package CI
        if: startsWith(matrix.package, 'domain-')
        uses: Volontariapp/ci-tools/.github/actions/domain-package-ci@main
        with:
          package_name: ${{ matrix.package }}
          package_path: packages/${{ matrix.package }}

      - name: Test Package
        if: ${{ !startsWith(matrix.package, 'domain-') }}
        run: |
          cd packages/${{ matrix.package }}
          if grep -q "\"test:coverage\":" package.json; then
            yarn test:coverage
          else
            yarn test
          fi

      - name: Publish Coverage Summary
        if: always()
        run: |
          COVERAGE_FILE="packages/${{ matrix.package }}/coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            echo "### Coverage for ${{ matrix.package }}" >> $GITHUB_STEP_SUMMARY
            echo "| Type | Percentage |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------------|" >> $GITHUB_STEP_SUMMARY
            LINES=$(jq -r '.total.lines.pct' $COVERAGE_FILE)
            STATEMENTS=$(jq -r '.total.statements.pct' $COVERAGE_FILE)
            FUNCTIONS=$(jq -r '.total.functions.pct' $COVERAGE_FILE)
            BRANCHES=$(jq -r '.total.branches.pct' $COVERAGE_FILE)
            echo "| Lines | ${LINES}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | ${STATEMENTS}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | ${FUNCTIONS}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | ${BRANCHES}% |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[🔍 View detailed HTML report in Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/lcov-report
          retention-days: 7

      - name: Upload Coverage Summary JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/coverage-summary.json
          retention-days: 7

      - name: Unified NPM & Yarn Auth
        if: github.event_name == 'pull_request' || github.event.pull_request != null
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "NPM_TOKEN is missing, skipping auth setup."
            exit 0
          fi
          # Ensuring npmrc is ready just in case some tools need it
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish Snapshot
        if: github.event_name == 'pull_request' || github.event.pull_request != null
        id: publish
        shell: bash
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$YARN_NPM_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is missing, skipping publish."
            exit 0
          fi
          
          PKG_JSON="packages/${{ matrix.package }}/package.json"
          SUFFIX="${{ inputs.snapshot_suffix }}"
          
          # 1. Update ALL packages in workspace to the shared snapshot version
          # This ensures that when we run resolve-workspaces.js, all internal dependencies match
          node -e "
            const fs = require('fs');
            const path = require('path');
            const packagesDir = 'packages';
            const suffix = '$SUFFIX' || ('snapshot.' + new Date().toISOString().replace(/[:.-]/g, '').slice(0, 14) + '.' + '${{ github.sha }}'.slice(0, 7));
            
            fs.readdirSync(packagesDir).forEach(dir => {
              const p = path.join(packagesDir, dir, 'package.json');
              if (fs.existsSync(p)) {
                const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
                // Only suffix if not already snapshotted
                if (!pkg.version.includes('snapshot')) {
                  pkg.version = pkg.version + '-' + suffix;
                  fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
                }
              }
            });
          "

          # 2. Resolve workspace:* dependencies to their real (snapshot) versions
          node scripts/resolve-workspaces.js

          # 3. Get metadata for current package
          PKG_NAME=$(node -p "require('./$PKG_JSON').name")
          SNAPSHOT_VER=$(node -p "require('./$PKG_JSON').version")

          # 4. Final Publish
          cd packages/${{ matrix.package }}
          yarn npm publish --access public --tag next

          # 5. Outputs for comment
          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "snapshot_ver=$SNAPSHOT_VER" >> "$GITHUB_OUTPUT"

      - name: Post Comment on PR
        if: steps.publish.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${{ steps.publish.outputs.pkg_name }}"
          VER="${{ steps.publish.outputs.snapshot_ver }}"
          TAG="${PKG}@${VER}"

          # Fetch coverage summary for this package
          SUMMARY_FILE="packages/${{ matrix.package }}/coverage/coverage-summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            LINES=$(jq -r '.total.lines.pct' "$SUMMARY_FILE")
            STMTS=$(jq -r '.total.statements.pct' "$SUMMARY_FILE")
            FUNCS=$(jq -r '.total.functions.pct' "$SUMMARY_FILE")
            BRCHS=$(jq -r '.total.branches.pct' "$SUMMARY_FILE")
            REPORT=$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s' \
              "### 📊 Rapport de CI" \
              "| Type | Couverture |" \
              "| :--- | :--- |" \
              "| 📏 Lines | **${LINES}%** |" \
              "| 📄 Statements | **${STMTS}%** |" \
              "| 📞 Functions | **${FUNCS}%** |" \
              "| 🌿 Branches | **${BRCHS}%** |")
          else
            REPORT="> [!NOTE]
            Pas de rapport de couverture trouvé pour ce package."
          fi

          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ] && [ "${{ github.event_name }}" == "pull_request" ]; then
             # Try fallback for some PR events
             PR_NUMBER=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
          fi

          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            REPORT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
            gh pr comment "$PR_NUMBER" --body "🚀 Nouvelle version de \`$PKG\` :
            $REPORT
            
            [🔍 Voir le rapport HTML détaillé]($REPORT_URL)

            **📦 Installation**
            \`\`\`bash
            yarn add $TAG
            \`\`\`

            **🔄 Mise à jour**
            \`\`\`bash
            yarn up $TAG
            \`\`\`"
          else
            echo "No PR number found, skipping comment."
            echo "### 🚀 Nouvelle version de \`$PKG\`" >> $GITHUB_STEP_SUMMARY
            echo "$REPORT" >> $GITHUB_STEP_SUMMARY
          fi
