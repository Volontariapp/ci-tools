name: Shared NPM CI

on:
  workflow_call:
    secrets:
      ORG_REPO_TOKEN:
        required: true
      NPM_TOKEN:
        required: true
    outputs:
      has_changes:
        description: "Boolean indicating if packages changed"
        value: ${{ jobs.orchestrate.outputs.has_changes }}
      build_matrix:
        description: "JSON array of package ids for the parallel test/build matrix"
        value: ${{ jobs.orchestrate.outputs.build_matrix }}
      publish_order:
        description: "JSON array of package ids in topological publish order"
        value: ${{ jobs.orchestrate.outputs.publish_order }}
      snapshot_suffix:
        description: "Shared snapshot suffix (e.g. snap-a1b2c3d)"
        value: ${{ jobs.orchestrate.outputs.snapshot_suffix }}
      json_plan:
        description: "Full orchestration plan JSON"
        value: ${{ jobs.orchestrate.outputs.json_plan }}

jobs:
  # ── Stage 1: Changelog compliance ─────────────────────────────────────────
  check-changelogs:
    name: Changelog Compliance
    uses: Volontariapp/ci-tools/.github/workflows/npm-packages-changelog.yml@main
    secrets:
      ORG_REPO_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}

  # ── Stage 2: Orchestration ────────────────────────────────────────────────
  orchestrate:
    name: Orchestrate
    uses: Volontariapp/ci-tools/.github/workflows/npm-job-orchestrate.yml@main
    secrets:
      ORG_REPO_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}

  # ── Stage 3: Parallel test + build (dynamic matrix) ───────────────────────
  test-build:
    name: Build & Test
    needs: [orchestrate]
    if: needs.orchestrate.outputs.has_changes == 'true'
    uses: Volontariapp/ci-tools/.github/workflows/npm-packages-test-build.yml@main
    with:
      changed_packages: ${{ needs.orchestrate.outputs.build_matrix }}
      snapshot_suffix:  ${{ needs.orchestrate.outputs.snapshot_suffix }}
    secrets:
      ORG_REPO_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
      NPM_TOKEN:      ${{ secrets.NPM_TOKEN }}

  # ── Stage 4a: Snapshot publish + PR comment (PRs only) ───────────────────
  snap-publish:
    name: Snapshot Publish
    needs: [check-changelogs, orchestrate, test-build]
    if: |
      needs.orchestrate.outputs.has_changes == 'true' &&
      github.event_name == 'pull_request'
    uses: Volontariapp/ci-tools/.github/workflows/npm-job-snap-release.yml@main
    with:
      json_plan: ${{ needs.orchestrate.outputs.json_plan }}
    secrets:
      ORG_REPO_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
      NPM_TOKEN:      ${{ secrets.NPM_TOKEN }}

  # ── Stage 4b: Definitive release (main only) ──────────────────────────────
  release:
    name: Release
    needs: [check-changelogs, orchestrate, test-build]
    if: |
      needs.orchestrate.outputs.has_changes == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    uses: Volontariapp/ci-tools/.github/workflows/npm-packages/release.yml@main
    with:
      json_plan: ${{ needs.orchestrate.outputs.json_plan }}
    secrets:
      ORG_REPO_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
      NPM_TOKEN:      ${{ secrets.NPM_TOKEN }}
