name: "Runner CI/CD Pipeline"

on:
  workflow_call:
    inputs:
      service-name:
        description: "Name of the runner repository (e.g. workers-runners)"
        required: true
        type: string
      services:
        description: "JSON array of all sub-services (e.g. '[\"worker-user\", \"worker-event\"]')"
        required: true
        type: string
      node-version:
        description: "Node.js version"
        required: false
        default: "24.14.0"
        type: string
    secrets:
      ORG_REPO_TOKEN:
        description: "GitHub token with access to private repositories and deploy repository"
        required: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      active-services: ${{ steps.filter.outputs.active-services }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Detect modified services
        id: filter
        shell: bash
        run: |
          SERVICES_JSON='${{ inputs.services }}'
          
          # Get list of changed files
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            if [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              changed_files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --name-only --format="" HEAD)
            else
              git fetch origin ${{ github.event.before }} --depth=1 || true
              changed_files=$(git diff --name-only ${{ github.event.before }} HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --name-only --format="" HEAD)
            fi
          fi

          echo "Changed files:"
          echo "$changed_files"
          
          # Check if CI files, workflows, or yarn lock changed, which forces all services to build
          FORCE_ALL=false
          if echo "$changed_files" | grep -qE "^\.github/|^\.yarnrc\.yml$|^yarn\.lock$|^package\.json$"; then
            FORCE_ALL=true
            echo "CI files or root package lock changed, forcing rebuild of all services."
          fi

          ACTIVE_SERVICES=()
          # Parse services JSON array and check for changes in their directories
          for service in $(echo "$SERVICES_JSON" | jq -r '.[]'); do
            if [ "$FORCE_ALL" = "true" ] || echo "$changed_files" | grep -q "^$service/"; then
              ACTIVE_SERVICES+=("$service")
            fi
          done

          ACTIVE_SERVICES_JSON=$(echo "${ACTIVE_SERVICES[@]}" | jq -R -c 'split(" ") | map(select(length > 0))')
          echo "active-services=$ACTIVE_SERVICES_JSON" >> $GITHUB_OUTPUT
          echo "Active services detected: $ACTIVE_SERVICES_JSON"

  check:
    name: Build & Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.active-services != '[]' && needs.changes.outputs.active-services != ''
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.active-services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Get Yarn Cache Directory
        id: yarn-cache-dir-path
        working-directory: ${{ matrix.service }}
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache Yarn Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ matrix.service }}-${{ hashFiles(format('{0}/yarn.lock', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ matrix.service }}-

      - name: Install Dependencies
        working-directory: ${{ matrix.service }}
        run: yarn install

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: yarn lint

      - name: Build
        working-directory: ${{ matrix.service }}
        run: yarn build

      # Conditional Integration Tests
      - name: Check for integration tests
        id: integration-check
        working-directory: ${{ matrix.service }}
        shell: bash
        run: |
          if jq -e '.scripts["test:integration"]' package.json >/dev/null; then
            echo "has_integration=true" >> $GITHUB_OUTPUT
          else
            echo "has_integration=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout ci-tools
        if: steps.integration-check.outputs.has_integration == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Volontariapp/ci-tools
          path: ci-tools
          token: ${{ secrets.ORG_REPO_TOKEN }}

      - name: Setup Database for integration tests
        if: steps.integration-check.outputs.has_integration == 'true'
        working-directory: ci-tools
        run: |
          docker compose up -d postgres-event redis
          # Wait for database to be ready
          until docker compose exec -T postgres-event pg_isready -U user -d ms_event; do
            echo "Waiting for postgres-event..."
            sleep 2
          done

      - name: Run Integration Tests
        if: steps.integration-check.outputs.has_integration == 'true'
        working-directory: ${{ matrix.service }}
        run: yarn test:integration --runInBand

  docker:
    name: Build & Push Docker Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.changes.outputs.active-services != '[]' && needs.changes.outputs.active-services != ''
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.active-services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha
          flavor: |
            latest=false

      - name: Build and Push Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Update Deploy Submodule
    runs-on: ubuntu-latest
    needs: [changes, docker]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.changes.outputs.active-services != '[]' && needs.changes.outputs.active-services != ''
    steps:
      - name: Generate Image List
        id: images
        run: |
          ACTIVE_SERVICES='${{ needs.changes.outputs.active-services }}'
          IMAGES=$(echo "$ACTIVE_SERVICES" | jq -r 'map("ghcr.io/volontariapp/" + .) | join(",")')
          echo "images=$IMAGES" >> $GITHUB_OUTPUT

      - name: Update Deploy Submodule and Images
        uses: Volontariapp/ci-tools/.github/actions/update-deploy@b8fb4cce7a9d9e0a6fe4d9d8645d0f2296f648af # main
        with:
          service: ${{ inputs.service-name }}
          sha: ${{ github.sha }}
          org-repo-token: ${{ secrets.ORG_REPO_TOKEN }}
          image-match: ${{ steps.images.outputs.images }}
