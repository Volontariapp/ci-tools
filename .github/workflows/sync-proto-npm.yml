name: Sync Proto to NPM Packages

on:
  workflow_call:
    inputs:
      proto_repository:
        description: "Repository containing the proto files"
        default: "Volontariapp/proto-registry"
        type: string
      npm_repository:
        description: "Repository for the npm packages"
        default: "Volontariapp/npm-packages"
        type: string
      node_version:
        description: "Node version to use"
        default: "24.14.0"
        type: string
    secrets:
      ORG_REPO_TOKEN:
        required: true

jobs:
  sync-proto-to-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Git Configuration
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout NPM Packages
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.npm_repository }}
          token: ${{ secrets.ORG_REPO_TOKEN }}
          path: npm-packages
          submodules: recursive

      - name: Checkout Proto Registry
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.proto_repository }}
          token: ${{ secrets.ORG_REPO_TOKEN }}
          path: proto-registry

      - name: Setup Node & Yarn
        uses: Volontariapp/ci-tools/.github/actions/setup-node-yarn@main
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install Protobuf Tools (buf & ts-proto)
        run: |
          npm install -g @bufbuild/buf ts-proto

      - name: Generate TypeScript types
        run: |
          cd proto-registry
          buf generate

          mkdir -p ../npm-packages/packages/domain-user/src/contracts
          mkdir -p ../npm-packages/packages/domain-post/src/contracts
          mkdir -p ../npm-packages/packages/domain-event/src/contracts

          cp -r gen/ts/volontariapp/user/v1/* ../npm-packages/packages/domain-user/src/contracts/ || true
          cp -r gen/ts/volontariapp/post/v1/* ../npm-packages/packages/domain-post/src/contracts/ || true
          cp -r gen/ts/volontariapp/event/v1/* ../npm-packages/packages/domain-event/src/contracts/ || true

      - name: Check modifications, bump versions, and create PR
        env:
          GH_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
        run: |
          cd npm-packages

          CHANGED_PKGS=$(git status --porcelain | awk '{print $2}' | grep '^packages/domain-.*/src/' | cut -d '/' -f 1,2 | sort | uniq)

          if [ -z "$CHANGED_PKGS" ]; then
            echo "No changes detected in proto definitions."
            exit 0
          fi

          echo "Changes detected in: $CHANGED_PKGS"

          BRANCH_NAME="bot/sync-proto-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH_NAME"

          for PKG in $CHANGED_PKGS; do
            echo "Bumping version for $PKG..."
            cd "$PKG"

            # Use --loglevel=error to prevent npm output from polluting versions
            npm version patch --no-git-tag-version --loglevel=error > /dev/null
            NEW_VERSION=$(node -p "require('./package.json').version")

            DATE=$(date +%Y-%m-%d)

            if [ -f CHANGELOG.md ]; then
              perl -pi -e 's/(All notable changes.*)/$1\n\n## ['"$NEW_VERSION"'] - '"$DATE"'\n\n### Changed\n\n- Auto-generated proto typings updated.\n/g' CHANGELOG.md

              if grep -q '^\[.*\].*github.com' CHANGELOG.md; then
                awk -v newlink="[$NEW_VERSION]: https://github.com/Volontariapp/npm-packages/pull/PR_PLACEHOLDER" '/^\[.*\]: / && !inserted {print newlink; inserted=1} 1' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
              else
                echo "[$NEW_VERSION]: https://github.com/Volontariapp/npm-packages/pull/PR_PLACEHOLDER" >> CHANGELOG.md
              fi
            else
              echo -e "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n## [$NEW_VERSION] - $DATE\n\n### Changed\n\n- Auto-generated proto typings updated.\n\n[$NEW_VERSION]: https://github.com/Volontariapp/npm-packages/pull/PR_PLACEHOLDER" > CHANGELOG.md
            fi

            cd ../..
          done

          git add packages/
          git commit -m "chore(proto): auto-update typings and prepare release"
          git push -u origin "$BRANCH_NAME"

          PR_URL=$(gh pr create --title "chore: sync proto typings" --body "Auto-generated proto typings update." --head "$BRANCH_NAME" --base main)
          echo "Created PR: $PR_URL"

          PR_NUMBER=$(echo "$PR_URL" | awk -F'/' '{print $NF}')

          for PKG in $CHANGED_PKGS; do
            if [ -f "$PKG/CHANGELOG.md" ]; then
              sed -i "s/PR_PLACEHOLDER/$PR_NUMBER/g" "$PKG/CHANGELOG.md"
            fi
          done

          git add packages/
          git commit -m "chore: inject PR link into changelogs"
          git push origin "$BRANCH_NAME"

          gh pr merge "$PR_URL" --auto --squash
