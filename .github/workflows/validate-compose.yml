name: "Validate Docker Compose"

on:
  push:
    branches: [ main ]
    paths:
      - '**/docker-compose.yml'
      - '**/docker-compose.override.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/docker-compose.yml'
      - '**/docker-compose.override.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Syntax & Config Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Root Compose (Default)
        run: docker compose config

      - name: Validate Root Compose (Monitoring Profile)
        run: docker compose --profile monitoring config

      - name: Validate Testing Compose (Default)
        run: docker compose -f testing/docker-compose.yml config

      - name: Validate Testing Compose (Test Profile)
        run: docker compose -f testing/docker-compose.yml --profile test config
