# Common build configuration for local development
x-local-build: &local-build
  context: .
  dockerfile: Dockerfile

services:
  # --- API GATEWAY ---
  api-gateway:
    profiles: ["local-api-gateway", "e2e"]
    build:
      <<: *local-build

  # Special service for E2E tests
  api-gateway-e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: Dockerfile.e2e
    container_name: api-gateway-e2e
    # Wait for the main API to be healthy before running tests
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - volontariapp-network
    environment:
      - NODE_ENV=test
      - E2E_TARGET_URL=http://api-gateway:5000

  # --- MICRO-SERVICES ---
  # These are defined here so they can be overridden when running 
  # compose from their respective directories.
  
  ms-user:
    profiles: ["local-ms-user"]
    build:
      <<: *local-build

  ms-post:
    profiles: ["local-ms-post"]
    build:
      <<: *local-build

  ms-event:
    profiles: ["local-ms-event"]
    build:
      <<: *local-build

  ms-social:
    profiles: ["local-ms-social"]
    build:
      <<: *local-build
