networks:
  volontariapp-network:
    driver: bridge

# --- 1. THE CENTRAL ROUTING TABLE (Shared by MS and Gateway) ---
x-grpc-routing: &grpc-routing
  MS_EVENT_URL: "ms-event:5003"
  MS_POST_URL: "ms-post:5002"
  MS_SOCIAL_URL: "ms-social:5004"
  MS_USER_URL: "ms-user:5001"
  MS_WS_URL: "ws-service:5005"
  MS_STORAGE_URL: "ms-storage:5006"
  MS_RANKING_URL: "ms-ranking:5007"

# --- 2. NETWORK & PORT BASIS ---
x-network-config: &network-config
  networks:
    - volontariapp-network

# --- 3. THE MICROSERVICE COMMON ENGINE ---
x-ms-common-env: &ms-common-env
  # Shared Redis configuration
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: password
  GRPC_HOST: "0.0.0.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://datadog-agent:4317"
  OTEL_SDK_DISABLED: "false"
  DD_ENV: "local"
  <<: *grpc-routing

x-redis-deps: &redis-deps
  redis: { condition: service_healthy }

x-microservice-base: &microservice-base
  <<: *network-config
  depends_on:
    <<: *redis-deps
  environment:
    <<: *ms-common-env
  volumes:
    - ./certs:/app/certs:ro

  healthcheck:
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
    start_interval: 1s

x-migration-base: &migration-base
  <<: *network-config
  volumes:
    - ./certs:/app/certs:ro
  entrypoint: ["/bin/sh", "-c", "node ./node_modules/typeorm/cli.js migration:run -d ./dist/config/data-source.js"]

# Async pipeline runners (outbox, post-processors). Only in the e2e profile: a local
# `docker compose up` must not start a second consumer next to the runners started on the host.
x-runner-base: &runner-base
  <<: *network-config
  profiles: [e2e]
  volumes:
    - ./certs:/app/certs:ro
  healthcheck:
    test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${PORT}/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
    start_interval: 1s

x-runner-fast-polling: &runner-fast-polling
  OUTBOX_BATCH_INTERVAL_MS: "100"
  POST_PROCESSOR_BLOCK_TIMEOUT: "1000"
  POST_PROCESSOR_RETRY_DELAY_MS: "200"

# Ranking settings shared by ms-ranking, post-processor-ranking and worker-ranking: no debounce
# (a compute job runs as soon as it is written), the same location key everywhere (the worker
# decrypts what ms-ranking stores) and no call to the external JEV scorer.
x-ranking-env: &ranking-env
  RANKING_DEBOUNCE_SECONDS: "0"
  RANKING_LOCATION_KEY: "test-only-location-key-32-bytes!"
  RANKING_JEV_ENABLED: "false"

# --- 4. DATABASE SPECIFIC ENVS ---
x-db-common: &db-common
  DB_PORT: "5432"
  DB_USERNAME: "user"
  DB_PASSWORD: "password"
  DB_MAX_POOL_SIZE: "10"
  DB_SSL: ""
  NODE_ENV: test

x-db-user: &db-user
  <<: *db-common
  DB_HOST: "postgres-user"
  DB_NAME: "ms_user"

x-db-post: &db-post
  <<: *db-common
  DB_HOST: "postgres-post"
  DB_NAME: "ms_post"

x-db-event: &db-event
  <<: *db-common
  DB_HOST: "postgres-event"
  DB_NAME: "ms_event"

x-db-social: &db-social
  <<: *db-common
  DB_HOST: "postgres-social"
  DB_NAME: "ms_social"
  # Neo4j specific
  NEO4J_SCHEME: "bolt"
  NEO4J_HOST: "neo4j-social"
  NEO4J_PORT: "7687"
  NEO4J_USERNAME: "neo4j"
  NEO4J_PASSWORD: "password"
  NEO4J_DATABASE: "neo4j"
  NEO4J_AUTH_SCHEME: "basic"
  NEO4J_REALM: "neo4j"

x-db-ws: &db-ws
  <<: *db-common
  DB_HOST: "postgres-ws"
  DB_NAME: "ms_ws"

x-db-storage: &db-storage
  <<: *db-common
  DB_HOST: "postgres-storage"
  DB_NAME: "ms_storage"

x-db-ranking: &db-ranking
  <<: *db-common
  DB_HOST: "postgres-ranking"
  DB_NAME: "ms_ranking"

# --- 5. STORAGE SPECIFIC ENVS ---
x-storage-env: &storage-env
  S3_ENDPOINT: "http://minio:9000"
  S3_PUBLIC_ENDPOINT: "http://localhost:9000"
  S3_REGION: "us-east-1"
  S3_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
  S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadminpassword}"
  S3_PUBLIC_BUCKET: "volontariapp-public"
  S3_PRIVATE_BUCKET: "volontariapp-private"
  S3_PUBLIC_BASE_URL: "http://localhost:9000/volontariapp-public"
  SCANNER_HOST: "clamd"
  SCANNER_PORT: "3310"
  SCANNER_TIMEOUT_MS: "30000"

services:
  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ['--config=/etc/otelcol/config.yaml']
    container_name: otel-collector
    profiles:
      - monitoring
    networks:
      - volontariapp-network
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - '1888:1888' # pprof extension
      - '8888:8888' # Prometheus metrics exposed by the Collector
      - '8889:8889' # Prometheus exporter metrics
      - '13133:13133' # health_check extension
      - '4317:4317' # OTLP gRPC receiver
      - '4318:4318' # OTLP http receiver
      - '55679:55679' # zpages extension
    healthcheck:
      test: ['CMD', '/otelcol', 'status']
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: jaeger
    profiles:
      - monitoring
    networks:
      - volontariapp-network
    ports:
      - '16686:16686' # UI
      - '4317' # OTLP gRPC default port
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://localhost:14269/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: datadog-agent
    profiles:
      - monitoring
    networks:
      - volontariapp-network
    ports:
      - '4317:4317'
      - '8126:8126'
    environment:
      - DD_API_KEY=${DD_API_KEY:-dummy_dev_key}
      - DD_SITE=us5.datadoghq.com
      - DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENDPOINT=0.0.0.0:4317
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE_LOGS=name:datadog-agent name:otel-collector name:jaeger name:postgres-.* name:redis.* name:neo4j.* name:minio.* name:.*-migration
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ms_user
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - '5432:5432'
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    networks:
      - volontariapp-network
    healthcheck:
      # -h 127.0.0.1 (TCP) on every postgres: on first start the image runs initdb scripts on a
      # temporary server that only listens on the unix socket, then restarts. A socket check
      # reports healthy during init and, with start_interval 1s, migrations hit the restart.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U user -d ms_user']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

  postgres-post:
    image: postgres:16-alpine
    container_name: postgres-post
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ms_post
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - '5433:5432'
    volumes:
      - postgres_post_data:/var/lib/postgresql/data
    networks:
      - volontariapp-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U user -d ms_post']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

  postgres-event:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: postgres-event
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ms_event
      NODE_ENV: test
    ports:
      - '5434:5432'
    volumes:
      - postgres_event_data:/var/lib/postgresql/data
    networks:
      - volontariapp-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U user -d ms_event']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

  postgres-social:
    image: postgres:16-alpine
    container_name: postgres-social
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ms_social
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - '5435:5432'
    volumes:
      - postgres_social_data:/var/lib/postgresql/data
    networks:
      - volontariapp-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U user -d ms_social']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

  postgres-ws:
    image: postgres:16-alpine
    container_name: postgres-ws
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ms_ws
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - '5436:5432'
    volumes:
      - postgres_ws_data:/var/lib/postgresql/data
    networks:
      - volontariapp-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U user -d ms_ws']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

  postgres-storage:
    image: postgres:16-alpine
    container_name: postgres-storage
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ms_storage
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - '5437:5432'
    volumes:
      - postgres_storage_data:/var/lib/postgresql/data
    networks:
      - volontariapp-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U user -d ms_storage']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

  postgres-ranking:
    image: postgres:16-alpine
    container_name: postgres-ranking
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ms_ranking
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - '5438:5432'
    volumes:
      - postgres_ranking_data:/var/lib/postgresql/data
    networks:
      - volontariapp-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U user -d ms_ranking']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

  neo4j-social:
    image: neo4j:5.20-community
    container_name: neo4j-social
    ports:
      - '7474:7474'
      - '7687:7687'
    environment:
      NEO4J_AUTH: neo4j/password
    networks:
      - volontariapp-network
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      # Neo4j takes ~25 s on a cold start: without a start period the 5 retries run out first.
      start_period: 60s
      start_interval: 1s

  redis:
    image: redis:7-alpine
    container_name: redis
    command: >
      redis-server
      --requirepass password
      --user user on >password ~* +@all
      --save ""
      --loglevel warning
    ports:
      - '6379:6379'
    networks:
      - volontariapp-network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'password', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
    volumes:
      - redis_data:/data
    restart: always
  
  redis-ws-service:
    image: redis:7-alpine
    container_name: redis-ws-service
    command: >
      redis-server
      --requirepass password
      --user user on >password ~* +@all
      --save ""
      --loglevel warning
    ports:
      - '6380:6379'
    networks:
      - volontariapp-network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'password', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
    volumes:
      - redis_ws_data:/data
    restart: always

  clamd:
    image: clamav/clamav:1.4
    container_name: clamd
    networks:
      - volontariapp-network
    ports:
      - '3310:3310'
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 10 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    networks:
      - volontariapp-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

  minio-init:
    profiles: [migrations]
    image: cgr.dev/chainguard/minio-client@sha256:f0dd93b48af1f8a641edcd3c64661c8dbe05189bd2ef2f8cea216eb18af10bf8
    container_name: minio-init

    depends_on:
      minio:
        condition: service_healthy
    networks:
      - volontariapp-network
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - ./scripts/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]

  # FAULT INJECTION (E2E): a TCP relay between selected services. Each proxy of
  # toxiproxy/proxies.json is named "<caller>__<callee>" and listens on its own port; the caller's
  # URL variable (for example MS_STORAGE_URL of ms-post) points to it instead of the callee. The
  # E2E tests cut, slow or restore a link through the HTTP API (port 8474, internal to the
  # network: api-gateway-e2e reads TOXIPROXY_URL). No healthcheck: the image has no shell, and the
  # proxies of the config file exist as soon as the process runs. See README, "Fault injection".
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy@sha256:5d3dae09bc185dcc5ff6cf43abf6062a4a720aff0c4306a471e773acdcd107aa # 2.13.0
    container_name: toxiproxy
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy/proxies.json:/config/toxiproxy.json:ro
    networks:
      - volontariapp-network

  # API-GATEWAY
  api-gateway:
    image: ghcr.io/volontariapp/api-gateway:${API_GATEWAY_TAG:-latest}
    container_name: api-gateway
    <<: *network-config

    environment:
      PORT: "5000"
      # Read deadline of gRPC calls to the microservices (prod default: 2000 ms). On the shared CI
      # runner, cold Neo4j reads of ms-social go past 2 s and the gateway answered 504 at random.
      # Read from process.env by api-gateway (src/common/grpc/read-deadline.ts), no config mapping.
      GRPC_READ_DEADLINE_MS: "15000"
      # Base URL of the public bucket (same value as storage-env). Without it the gateway omits
      # avatarUrl, media[].url and coverUrl from its responses (PublicFileUrlService), so an E2E
      # test cannot see them. Mapped by api-gateway/config/custom-env-vars.json (storage.publicBaseUrl).
      S3_PUBLIC_BASE_URL: "http://localhost:9000/volontariapp-public"
      <<: *grpc-routing

    volumes:
      - ./certs:/app/certs:ro

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

    depends_on:
      ms-social: { condition: service_healthy }
      ms-user:   { condition: service_healthy }
      ms-post:   { condition: service_healthy }
      ms-event:  { condition: service_healthy }
      ms-ranking: { condition: service_healthy }

  # API-GATEWAY-E2E
  api-gateway-e2e:
    image: ghcr.io/volontariapp/api-gateway-e2e:${API_GATEWAY_TAG:-latest}
    container_name: api-gateway-e2e
    profiles:
      - e2e
    depends_on:
      api-gateway: { condition: service_healthy }
      outbox-user: { condition: service_healthy }
      outbox-social: { condition: service_healthy }
      outbox-event: { condition: service_healthy }
      outbox-post: { condition: service_healthy }
      outbox-ranking: { condition: service_healthy }
      outbox-storage: { condition: service_healthy }
      outbox-ws: { condition: service_healthy }
      post-processor-social: { condition: service_healthy }
      post-processor-ranking: { condition: service_healthy }
      post-processor-post: { condition: service_healthy }
      post-processor-event: { condition: service_healthy }
      post-processor-storage: { condition: service_healthy }
      post-processor-user: { condition: service_healthy }
      worker-ranking: { condition: service_healthy }
      worker-storage: { condition: service_healthy }
      ms-storage: { condition: service_healthy }
      ws-service: { condition: service_healthy }
      toxiproxy: { condition: service_started }
    networks:
      - volontariapp-network
    volumes:
      - ./certs:/app/certs:ro
    environment:
      - NODE_ENV=test
      - E2E_TARGET_URL=http://api-gateway:5000
      - E2E_RANKING_ENABLED=true
      # HTTP API of toxiproxy, to cut / slow / restore a link (see README, "Fault injection").
      - TOXIPROXY_URL=http://toxiproxy:8474
      # Upload URLs are signed for S3_PUBLIC_ENDPOINT (localhost:9000), which does not reach minio
      # from this container. A POST policy does not sign the host: the tests post the same form here.
      - E2E_S3_ORIGIN=http://minio:9000

  # Micro-services
  # Migration containers run as a dedicated pre-step (--profile migrations --wait)
  # to avoid triggering --abort-on-container-exit during the e2e run.
  ms-social-migration:
    <<: *migration-base
    profiles: [migrations]
    image: ghcr.io/volontariapp/ms-social:${MS_SOCIAL_TAG:-latest}
    container_name: ms-social-migration
    environment:
      <<: [*ms-common-env, *db-social]
    depends_on:
      postgres-social: { condition: service_healthy }
      neo4j-social: { condition: service_healthy }

  ms-social:
    image: ghcr.io/volontariapp/ms-social:${MS_SOCIAL_TAG:-latest}
    container_name: ms-social
    <<: *microservice-base
    environment:
      <<: [*ms-common-env, *db-social]
      PORT: "3004"
      # Neo4j read transaction timeout of ms-social (prod default: 1800 ms). On the shared CI
      # runner, cold Neo4j reads go past 1.8 s and E2E requests failed with 500 at random.
      # Read from process.env by domain-social (NEO4J_READ_TRANSACTION_TIMEOUT_MS, 0.22.0+).
      NEO4J_READ_TRANSACTION_TIMEOUT_MS: "10000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    depends_on:
      <<: *redis-deps
      postgres-social: { condition: service_healthy }
      neo4j-social: { condition: service_healthy }

  ms-user-migration:
    <<: *migration-base
    profiles: [migrations]
    image: ghcr.io/volontariapp/ms-user:${MS_USER_TAG:-latest}
    container_name: ms-user-migration
    environment:
      <<: [*ms-common-env, *db-user]
    depends_on:
      postgres-user: { condition: service_healthy }

  ms-user:
    image: ghcr.io/volontariapp/ms-user:${MS_USER_TAG:-latest}
    container_name: ms-user
    <<: *microservice-base
    environment:
      PORT: "3001"
      <<: [*ms-common-env, *db-user]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    depends_on:
      <<: *redis-deps
      postgres-user: { condition: service_healthy }
      # storage-client resolves ms-storage at startup (G7): without the container, Docker DNS
      # fails, the channel stays in TRANSIENT_FAILURE and ConfirmFileAttachment answers 503.
      ms-storage: { condition: service_healthy }

  ms-post-migration:
    <<: *migration-base
    profiles: [migrations]
    image: ghcr.io/volontariapp/ms-post:${MS_POST_TAG:-latest}
    container_name: ms-post-migration
    environment:
      <<: [*ms-common-env, *db-post]
    depends_on:
      postgres-post: { condition: service_healthy }

  ms-post:
    image: ghcr.io/volontariapp/ms-post:${MS_POST_TAG:-latest}
    container_name: ms-post
    <<: *microservice-base
    environment:
      PORT: "3002"
      <<: [*ms-common-env, *db-post]
      # The call to ms-storage goes through the toxiproxy proxy "ms-post__ms-storage"
      # (toxiproxy/proxies.json), so an E2E test can cut or slow this one link. Transparent while
      # the proxy is enabled. Overrides the value merged from grpc-routing.
      MS_STORAGE_URL: "toxiproxy:17001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    depends_on:
      <<: *redis-deps
      postgres-post: { condition: service_healthy }
      # storage-client: ms-storage must resolve at startup (G7, see ms-user).
      ms-storage: { condition: service_healthy }
      toxiproxy: { condition: service_started }

  ms-event-migration:
    <<: *migration-base
    profiles: [migrations]
    image: ghcr.io/volontariapp/ms-event:${MS_EVENT_TAG:-latest}
    container_name: ms-event-migration
    environment:
      <<: [*ms-common-env, *db-event]
    depends_on:
      postgres-event: { condition: service_healthy }

  ms-event:
    image: ghcr.io/volontariapp/ms-event:${MS_EVENT_TAG:-latest}
    container_name: ms-event
    <<: *microservice-base
    environment:
      PORT: "3003"
      <<: [*ms-common-env, *db-event]
      # Through the toxiproxy proxy "ms-event__ms-storage", see ms-post.
      MS_STORAGE_URL: "toxiproxy:17002"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    depends_on:
      <<: *redis-deps
      postgres-event: { condition: service_healthy }
      # storage-client: ms-storage must resolve at startup (G7, see ms-user).
      ms-storage: { condition: service_healthy }
      toxiproxy: { condition: service_started }

  ms-storage-migration:
    <<: *migration-base
    profiles: [migrations]
    image: ghcr.io/volontariapp/ms-storage:${MS_STORAGE_TAG:-latest}
    container_name: ms-storage-migration
    environment:
      <<: [*ms-common-env, *db-storage]
    depends_on:
      postgres-storage: { condition: service_healthy }

  ms-storage:
    image: ghcr.io/volontariapp/ms-storage:${MS_STORAGE_TAG:-latest}
    container_name: ms-storage
    <<: *microservice-base
    environment:
      PORT: "3006"
      <<: [*ms-common-env, *db-storage, *storage-env]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    depends_on:
      <<: *redis-deps
      postgres-storage: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamd: { condition: service_healthy }

  ms-ranking-migration:
    <<: *migration-base
    profiles: [migrations]
    image: ghcr.io/volontariapp/ms-ranking:${MS_RANKING_TAG:-latest}
    container_name: ms-ranking-migration
    environment:
      <<: [*ms-common-env, *db-ranking]
    depends_on:
      postgres-ranking: { condition: service_healthy }

  ms-ranking:
    image: ghcr.io/volontariapp/ms-ranking:${MS_RANKING_TAG:-latest}
    container_name: ms-ranking
    <<: *microservice-base
    environment:
      PORT: "3007"
      <<: [*ms-common-env, *db-ranking, *ranking-env]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3007/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    depends_on:
      <<: *redis-deps
      postgres-ranking: { condition: service_healthy }

  # Async pipeline runners. Tags come from e2e-matrix.json (one key per runner repo).
  # user.created: ms-user trigger -> event_queue (ms_user) -> outbox-user -> stream social:user
  # -> post-processor-social (Neo4j node + follow-up in event_queue of ms_social) -> outbox-social.
  outbox-user:
    <<: *runner-base
    image: ghcr.io/volontariapp/outbox-user:${OUTBOX_RUNNERS_TAG:-latest}
    container_name: outbox-user
    environment:
      <<: [*ms-common-env, *db-user, *runner-fast-polling]
      PORT: "4101"
    depends_on:
      <<: *redis-deps
      postgres-user: { condition: service_healthy }

  outbox-social:
    <<: *runner-base
    image: ghcr.io/volontariapp/outbox-social:${OUTBOX_RUNNERS_TAG:-latest}
    container_name: outbox-social
    environment:
      <<: [*ms-common-env, *db-social, *runner-fast-polling]
      PORT: "4102"
    depends_on:
      <<: *redis-deps
      postgres-social: { condition: service_healthy }

  # event.created / event.deleted: ms-event (event_queue of ms_event) -> outbox-event -> streams
  # event:created / event:deleted -> post-processor-social (SocialEvent node and CREATED link of
  # the organizer, DETACH DELETE on deletion) and post-processor-ranking (fan-out job).
  outbox-event:
    <<: *runner-base
    image: ghcr.io/volontariapp/outbox-event:${OUTBOX_RUNNERS_TAG:-latest}
    container_name: outbox-event
    environment:
      <<: [*ms-common-env, *db-event, *runner-fast-polling]
      PORT: "4104"
    depends_on:
      <<: *redis-deps
      postgres-event: { condition: service_healthy }

  # post.created / post.deleted: ms-post (event_queue of ms_post) -> outbox-post -> streams
  # post:created / post:deleted -> post-processor-social (SocialPost node, OWN link of the author,
  # LINK_TO_EVENT when the event node exists) and post-processor-ranking (feed fan-out job).
  outbox-post:
    <<: *runner-base
    image: ghcr.io/volontariapp/outbox-post:${OUTBOX_RUNNERS_TAG:-latest}
    container_name: outbox-post
    environment:
      <<: [*ms-common-env, *db-post, *runner-fast-polling]
      PORT: "4103"
    depends_on:
      <<: *redis-deps
      postgres-post: { condition: service_healthy }

  post-processor-social:
    <<: *runner-base
    image: ghcr.io/volontariapp/post-processor-social:${POST_PROCESSORS_RUNNER_TAG:-latest}
    container_name: post-processor-social
    environment:
      <<: [*ms-common-env, *db-social, *runner-fast-polling]
      PORT: "4204"
    depends_on:
      <<: *redis-deps
      postgres-social: { condition: service_healthy }
      neo4j-social: { condition: service_healthy }

  # Ranking: post-processor-ranking turns user.created, event.created, post.created... into compute
  # or fan-out jobs in jobs_outbox of ms_ranking; ms-ranking writes the on-demand and manual jobs
  # there too. outbox-ranking pushes them to BullMQ and worker-ranking computes the lists (gRPC
  # calls to ms-social, ms-event and ms-post with the internal token).
  outbox-ranking:
    <<: *runner-base
    image: ghcr.io/volontariapp/outbox-ranking:${OUTBOX_RUNNERS_TAG:-latest}
    container_name: outbox-ranking
    environment:
      <<: [*ms-common-env, *db-ranking, *runner-fast-polling]
      PORT: "4107"
    depends_on:
      <<: *redis-deps
      postgres-ranking: { condition: service_healthy }

  post-processor-ranking:
    <<: *runner-base
    image: ghcr.io/volontariapp/post-processor-ranking:${POST_PROCESSORS_RUNNER_TAG:-latest}
    container_name: post-processor-ranking
    environment:
      <<: [*ms-common-env, *db-ranking, *runner-fast-polling, *ranking-env]
      PORT: "4206"
    depends_on:
      <<: *redis-deps
      postgres-ranking: { condition: service_healthy }

  worker-ranking:
    <<: *runner-base
    image: ghcr.io/volontariapp/worker-ranking:${WORKERS_RUNNERS_TAG:-latest}
    container_name: worker-ranking
    environment:
      <<: [*ms-common-env, *db-ranking, *ranking-env]
      PORT: "4307"
    depends_on:
      <<: *redis-deps
      postgres-ranking: { condition: service_healthy }

  # Account deletion (user.deleted fan-out, USER_DELETION gather of ws-service). Each domain purges
  # then writes its acknowledgement (USER_*_DELETED, or USER_*_DELETION_FAILED from the DLQ hook) to
  # its own event_queue; its outbox pushes it to ws:user-deleted-feedback. post-processor-social
  # (above) and post-processor-ranking (above) already run; these complete the five domains:
  #   post-processor-post: posts purged, comments anonymised (ms_post, outbox-post);
  #   post-processor-event: events of the organizer deleted, event.deleted re-emitted (ms_event,
  #     outbox-event). It also consumes event.created: GEOCODING_ENABLED=false keeps the locations
  #     given by the scenarios (in NODE_ENV=test the geocoder answers fixed Paris coordinates);
  #   post-processor-storage: files of the owner released (ms_storage, outbox-storage).
  # Once the five keys are in, ws-service writes user.deletion_successfull to ms_ws: outbox-ws
  # pushes it and post-processor-user calls finalizeDeletion (users row deleted).
  post-processor-post:
    <<: *runner-base
    image: ghcr.io/volontariapp/post-processor-post:${POST_PROCESSORS_RUNNER_TAG:-latest}
    container_name: post-processor-post
    environment:
      <<: [*ms-common-env, *db-post, *runner-fast-polling]
      PORT: "4202"
    depends_on:
      <<: *redis-deps
      postgres-post: { condition: service_healthy }

  post-processor-event:
    <<: *runner-base
    image: ghcr.io/volontariapp/post-processor-event:${POST_PROCESSORS_RUNNER_TAG:-latest}
    container_name: post-processor-event
    environment:
      <<: [*ms-common-env, *db-event, *runner-fast-polling]
      PORT: "4203"
      GEOCODING_ENABLED: "false"
    depends_on:
      <<: *redis-deps
      postgres-event: { condition: service_healthy }

  post-processor-storage:
    <<: *runner-base
    image: ghcr.io/volontariapp/post-processor-storage:${POST_PROCESSORS_RUNNER_TAG:-latest}
    container_name: post-processor-storage
    environment:
      <<: [*ms-common-env, *db-storage, *runner-fast-polling]
      PORT: "4205"
    depends_on:
      <<: *redis-deps
      postgres-storage: { condition: service_healthy }

  # finalizeDeletion lives in domain-user: post-processor-user writes to ms_user and signs an
  # internal token (certs/internal.key) for its gRPC calls to ms-social.
  post-processor-user:
    <<: *runner-base
    image: ghcr.io/volontariapp/post-processor-user:${POST_PROCESSORS_RUNNER_TAG:-latest}
    container_name: post-processor-user
    environment:
      <<: [*ms-common-env, *db-user, *runner-fast-polling]
      PORT: "4201"
      # Credit the badge points into total_impact_score so the badge scenarios can assert them.
      BADGE_POINTS_ENABLED: "true"
    depends_on:
      <<: *redis-deps
      postgres-user: { condition: service_healthy }

  # Files: ms-storage writes scan jobs (jobs_outbox) and storage events (event_queue) to ms_storage.
  # outbox-storage pushes both; worker-storage scans ASYNC uploads (clamd) and publishes to minio.
  outbox-storage:
    <<: *runner-base
    image: ghcr.io/volontariapp/outbox-storage:${OUTBOX_RUNNERS_TAG:-latest}
    container_name: outbox-storage
    environment:
      <<: [*ms-common-env, *db-storage, *runner-fast-polling]
      PORT: "4106"
    depends_on:
      <<: *redis-deps
      postgres-storage: { condition: service_healthy }

  worker-storage:
    <<: *runner-base
    image: ghcr.io/volontariapp/worker-storage:${WORKERS_RUNNERS_TAG:-latest}
    container_name: worker-storage
    environment:
      <<: [*ms-common-env, *db-storage, *storage-env]
      PORT: "4306"
    depends_on:
      <<: *redis-deps
      postgres-storage: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamd: { condition: service_healthy }

  # Gather completions (user.deletion_successfull, *.creation_failed...): ws-service writes them to
  # event_queue of ms_ws, outbox-ws pushes them to the domain streams.
  outbox-ws:
    <<: *runner-base
    image: ghcr.io/volontariapp/outbox-ws:${OUTBOX_RUNNERS_TAG:-latest}
    container_name: outbox-ws
    environment:
      <<: [*ms-common-env, *db-ws, *runner-fast-polling]
      PORT: "4105"
    depends_on:
      <<: *redis-deps
      postgres-ws: { condition: service_healthy }

  # ws-service: socket.io server behind the api-gateway proxy (MS_WS_URL in x-grpc-routing,
  # hence PORT 5005). REDIS_* is its own Redis (tracked users), GLOBAL_REDIS_* the main Redis
  # (event streams and socket.io adapter). It gathers user.created (stream user:created) with
  # USER_SOCIAL_CREATED (stream ws:user-created-feedback) and pushes user.created to the sockets.
  ws-service-migration:
    <<: *migration-base
    profiles: [migrations]
    image: ghcr.io/volontariapp/ws-service:${WS_SERVICE_TAG:-latest}
    container_name: ws-service-migration
    environment:
      <<: [*ms-common-env, *db-ws]
    depends_on:
      postgres-ws: { condition: service_healthy }

  ws-service:
    <<: *runner-base
    image: ghcr.io/volontariapp/ws-service:${WS_SERVICE_TAG:-latest}
    container_name: ws-service
    environment:
      <<: [*ms-common-env, *db-ws, *runner-fast-polling]
      PORT: "5005"
      LOGGER_LEVEL: "info"
      REDIS_HOST: redis-ws-service
      REDIS_PORT: "6379"
      REDIS_PASSWORD: password
      GLOBAL_REDIS_HOST: redis
      GLOBAL_REDIS_PORT: "6379"
      GLOBAL_REDIS_PASSWORD: password
    depends_on:
      <<: *redis-deps
      redis-ws-service: { condition: service_healthy }
      postgres-ws: { condition: service_healthy }

volumes:
  postgres_user_data:
  postgres_post_data:
  postgres_event_data:
  postgres_social_data:
  postgres_ws_data:
  postgres_storage_data:
  postgres_ranking_data:
  neo4j_social_data:
  redis_data:
  redis_ws_data:
  minio_data:
