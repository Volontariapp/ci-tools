# Dependabot PRs carry docker-e2e and docker-and-e2e (the latter is required by the CI Docker and E2E jobs).
# Template for a runner repository (workers-runners, post-processors-runner, outbox-runners).
# `directories` lists every sub-package: Dependabot groups them so a bump lands in ONE pull request.
# Keep the list in sync with the `services` input of .github/workflows/ci.yml.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/worker-example"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker-and-e2e"
      - "docker-e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # A single pull request per week for every version update (majors and @volontariapp/* included):
      # the E2E suite runs once instead of once per dependency.
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      # Security updates keep their own pull request so they are never held back by a risky major bump.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker-and-e2e"
      - "docker-e2e"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/worker-example"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker-and-e2e"
      - "docker-e2e"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    groups:
      docker-dependencies:
        patterns:
          - "*"
