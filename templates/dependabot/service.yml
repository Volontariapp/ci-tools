# Template for a microservice or package repository (single root package.json).
# Copy to <repo>/.github/dependabot.yml. Drop the "docker" block when the repo has no Dockerfile.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # First match wins: @volontariapp/* always lands in its own PR, on the latest published version.
      volontariapp:
        patterns:
          - "@volontariapp/*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      docker-dependencies:
        patterns:
          - "*"
